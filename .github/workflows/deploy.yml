name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - core-api
          - judge-service
          - ai-gateway
          - realtime
          - worker
          - web
          - infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.event.inputs.environment }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy Infrastructure
        if: github.event.inputs.service == 'infra'
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Build and push Docker image
        if: github.event.inputs.service != 'infra' && github.event.inputs.service != 'web'
        working-directory: services/${{ github.event.inputs.service }}
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          docker build -t xkill/${{ github.event.inputs.service }}:${{ github.sha }} .
          docker tag xkill/${{ github.event.inputs.service }}:${{ github.sha }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/xkill/${{ github.event.inputs.service }}:${{ github.sha }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/xkill/${{ github.event.inputs.service }}:${{ github.sha }}
          aws ecs update-service --cluster xkill-${{ github.event.inputs.environment }} --service ${{ github.event.inputs.service }} --force-new-deployment

      - name: Deploy Next.js app
        if: github.event.inputs.service == 'web'
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          aws s3 sync out/ s3://xkill-${{ github.event.inputs.environment }}-web --delete
