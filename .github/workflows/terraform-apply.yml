name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.event.inputs.environment }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Terraform Init
        run: terraform init
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
